<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self';">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>VShoon</title>
		<link rel="stylesheet" href="./startWindow.css">
	</head>
	<body>
		<main class="start-window" aria-labelledby="product-name">
			<header class="product-header">
				<img class="product-mark" src="./vshoon-logo.png" alt="" width="52" height="52">
				<div>
					<h1 id="product-name">VShoon</h1>
					<p id="product-subtitle"></p>
				</div>
			</header>

			<section class="workspace" aria-labelledby="recent-title">
				<div class="section-heading">
					<h2 id="recent-title"></h2>
					<span id="recent-count" aria-live="polite"></span>
				</div>

				<p id="recent-navigation-help" class="screen-reader-only"></p>
				<ul id="recent-list" class="recent-list" aria-labelledby="recent-title" aria-describedby="recent-navigation-help" aria-busy="true"></ul>

				<div id="empty-state" class="empty-state" role="status" hidden>
					<strong id="empty-title"></strong>
					<p id="empty-description"></p>
				</div>
			</section>

			<footer class="actions">
				<button id="quit" class="secondary" type="button"></button>
				<button id="open-empty" class="secondary" type="button"></button>
				<button id="open-workspace" class="secondary" type="button"></button>
				<button id="open-folder" class="primary" type="button"></button>
			</footer>

			<p id="status" class="status" role="status" aria-live="polite"></p>
		</main>
		<script type="module" src="./startWindow.js"></script>
	</body>
</html>
