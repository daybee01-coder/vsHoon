# 통합 테스트용 데이터베이스.
#
# 로컬에 이미 깔린 DB 와 포트가 겹치지 않도록 전부 1 을 앞에 붙인 포트를 쓴다.
# 필요한 것만 골라 띄워도 된다 — 테스트는 접속되지 않는 대상을 건너뛴다.
#
#   docker compose -f test/integration/docker-compose.yml up -d postgres mysql
#   npm run test:integration
#   docker compose -f test/integration/docker-compose.yml down -v

services:
  mysql:
    image: mysql:8.4
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: dbconn
      MYSQL_DATABASE: dbconn_it
    ports:
      - '13306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pdbconn']
      interval: 5s
      timeout: 5s
      retries: 20

  # 시퀀스는 MariaDB 에만 있어 별도로 띄운다 — MySQL 경로와 SQL 이 갈리는 지점이다.
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dbconn
      MARIADB_DATABASE: dbconn_it
    ports:
      - '13307:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dbconn
      POSTGRES_DB: dbconn_it
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dbconn_it']
      interval: 5s
      timeout: 5s
      retries: 20

  # 공식 XE 이미지보다 가볍고 기동이 빠르다. 그래도 첫 기동은 1~2분 걸린다.
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: dbconn
    ports:
      - '11521:1521'
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 10s
      retries: 30
